name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  nro:
    name: Switch app (qemu-kitkat-arm.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 python3-pip python3-venv ninja-build pkg-config \
            xz-utils bzip2 patch curl ca-certificates
          # glib 2.82 needs a newer meson than Debian ships
          python3 -m pip install --break-system-packages 'meson>=1.5,<2'
          dkp-pacman -Sy --noconfirm --needed switch-sdl2 switch-zlib switch-mesa

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: src
          key: src-${{ hashFiles('scripts/fetch-sources.sh', 'patches/**') }}

      - name: Build
        env:
          HOST_CC: gcc
        run: scripts/build-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-kitkat-arm-nro
          path: out/qemu-kitkat-arm.nro
          if-no-files-found: error

  kernel:
    name: Android kernel (zImage + DTB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel
        run: arm/build-kernel.sh

      - name: Collect
        run: |
          mkdir -p dist
          cp build/arm/zImage dist/zImage
          cp build/arm/vexpress-v2p-ca15-tc1.dtb dist/vexpress.dtb

      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nro, kernel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qemu-kitkat-arm.nro
            dist/zImage
            dist/vexpress.dtb
          generate_release_notes: true
